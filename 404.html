    <!-- No-flash theme: set data-theme before first paint. Mirrors src/theme.ts resolveTheme. -->
    <script>
      (function () {
        var t = 'system'
        try { t = JSON.parse(localStorage.getItem('rosario.prefs') || '{}').theme || t } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
